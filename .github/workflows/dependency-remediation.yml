name: One-time dependency remediation
# Rebuild the npm lockfile after removing the temporary Git override.

on:
  push:
    branches: ['audit/astronomy-accuracy-fixes']
    paths: ['.github/workflows/dependency-remediation.yml', 'package.json']

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/astronomy-accuracy-fixes
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Apply npm's compatible security remediations
        run: |
          npm install --save-dev vite@6.4.6 @vitejs/plugin-react@5.2.0 vitest@5.1.1
          npm audit --json > "$RUNNER_TEMP/npm-audit-after-install.json" || true
          node -e "const r=require(process.env.RUNNER_TEMP + '/npm-audit-after-install.json'); console.log('Full dependency audit:', JSON.stringify(r.metadata?.vulnerabilities ?? {})); for (const [name, item] of Object.entries(r.vulnerabilities ?? {})) { console.log(name + ': ' + item.severity + ', direct=' + item.isDirect + ', range=' + item.range + ', fix=' + JSON.stringify(item.fixAvailable)); for (const advisory of item.via ?? []) if (typeof advisory === 'object') console.log('  - ' + advisory.title + ' | ' + advisory.url + ' | ' + advisory.range); }"
          npm ls picomatch tinypool fdir tinyglobby --all || true

      - name: Require clean production dependency audit
        run: npm audit --omit=dev

      - name: Run unit tests
        run: npm test

      - name: Typecheck and production build
        run: npm run build

      - name: Commit verified dependency updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency files changed."
            exit 0
          fi
          git commit -m "fix(deps): remediate npm security advisories"
          git push origin HEAD:audit/astronomy-accuracy-fixes
