name: One-time dependency remediation

on:
  push:
    branches: ['audit/astronomy-accuracy-fixes']
    paths: ['.github/workflows/dependency-remediation.yml']

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/astronomy-accuracy-fixes
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Apply npm's compatible security remediations
        run: |
          npm audit fix --force || true
          npm install --save-dev vite@6.4.6 @vitejs/plugin-react@5.2.0 vitest@3.2.7 --force

      - name: Require no high or critical advisories
        run: npm audit --audit-level=high

      - name: Run unit tests
        run: npm test

      - name: Typecheck and production build
        run: npm run build

      - name: Commit verified dependency updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency files changed."
            exit 0
          fi
          git commit -m "fix(deps): remediate npm security advisories"
          git push origin HEAD:audit/astronomy-accuracy-fixes
