name: Pull Request CI

on:
  pull_request:
    branches: ['main']
  push:
    branches:
      - 'audit/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Report dependency security audit
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e "const r=require(process.env.RUNNER_TEMP + '/npm-audit.json'); console.log('Dependency vulnerabilities:', JSON.stringify(r.metadata?.vulnerabilities ?? {})); for (const [name, item] of Object.entries(r.vulnerabilities ?? {})) { console.log(name + ': ' + item.severity + ', direct=' + item.isDirect + ', range=' + item.range + ', fix=' + JSON.stringify(item.fixAvailable)); for (const advisory of item.via ?? []) if (typeof advisory === 'object') console.log('  - ' + advisory.title + ' | ' + advisory.url + ' | ' + advisory.range); }"

      - name: Run unit tests
        run: npm test

      - name: Typecheck and build
        run: npm run build
